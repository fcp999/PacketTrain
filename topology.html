<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PacketTrain Traffic Map</title>
<style>:root{color-scheme:dark;font:14px system-ui;background:#09131b;color:#e8f2f5}body{margin:0;padding:20px}header,nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{color:#93d500;margin-right:auto}a{color:#93d500}select,input,button{padding:9px;border:1px solid #345264;border-radius:7px;background:#162633;color:white}button{cursor:pointer}main{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-top:15px}section{background:#11212c;border:1px solid #29404c;border-radius:10px;padding:14px;min-width:0}svg{width:100%;height:70vh;min-height:460px}line{cursor:pointer}circle{cursor:pointer}text{fill:#dcecf1;font-size:11px;pointer-events:none}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #29404c;padding:7px;text-align:left}tbody tr{cursor:pointer}tbody tr:hover{background:#28404d}.muted{color:#93acb9}#details{overflow-wrap:anywhere}@media(max-width:850px){main{grid-template-columns:1fr}}</style></head><body>
<header><h1>Packet<span style="color:white">Train</span> Traffic Map</h1><a href="/">TCP replay</a></header><nav><label>Capture <select id="capture"></select></label><label>Top pairs <select id="top"><option>10</option><option selected>25</option><option>50</option><option>100</option><option>250</option></select></label><label>Layout <select id="layout"><option value="circle">Circle</option><option value="star">Star</option><option value="grid">Grid</option><option value="concentric">Concentric</option></select></label><label>Edge metric <select id="edgeMetric"><option value="bytes">TCP payload bytes</option><option value="packets">Packets</option><option value="throughput">Average payload rate</option><option value="resets">RST presence</option><option value="completions">Observed closure</option></select></label><label>Find host <input id="search" placeholder="IP substring"></label><button id="reload">Refresh</button></nav><p id="status" class="muted">Select a capture.</p><main><section><svg id="graph" viewBox="0 0 950 660" aria-label="Host communication circle"></svg><p class="muted">Lines show TCP connections; thickness is scaled by payload volume. Click a connection for details. RST and closure colors show observed TCP flags, not proof of network health.</p></section><section><h2>Connections</h2><div id="details" class="muted">Click a line or table row.</div><table><thead><tr><th>Endpoints</th><th>Bytes</th><th>Flows</th></tr></thead><tbody id="pairs"></tbody></table></section></main>
<script>
const el=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";let state=null;
function svg(name,attrs,parent){let node=document.createElementNS(NS,name);for(let [key,value] of Object.entries(attrs))node.setAttribute(key,value);parent.append(node);return node}
function showEdge(e){el("details").replaceChildren();const p=document.createElement("p");p.textContent=e.source+" ↔ "+e.target+" | "+e.bytes.toLocaleString()+" TCP payload bytes | "+e.packets.toLocaleString()+" packets | "+e.streams+" flows | ports "+e.ports.join(", ")+" | captured "+(e.captured_bytes||0).toLocaleString()+" bytes | RST-bearing flows "+(e.resets||0)+" | closed flows "+(e.closed_flows||0)+" | duration "+(e.duration_ms||0).toFixed(1)+" ms";el("details").append(p);const a=document.createElement("a");a.href="/?file="+encodeURIComponent(el("capture").value)+"&stream="+encodeURIComponent(e.stream);a.textContent="Open representative TCP stream #"+e.stream;el("details").append(a)}
function edgeColor(e,mode){
 if(mode==="resets")return e.resets>0?"#ff7770":"#93d500";
 if(mode==="completions")return e.closed_flows>=e.streams?"#93d500":e.closed_flows>0?"#ffd08f":"#ff7770";
 if(mode==="throughput"){const speed=e.duration_ms>0?1000*e.bytes/e.duration_ms:0;return speed>1e6?"#ff7770":speed>1e5?"#ffd08f":"#93d500";}
 return "#93d500";
}
function arrange(nodes){
 const mode=el("layout").value,positions=new Map(),total=nodes.length;
 const sorted=[...nodes].sort((a,b)=>b.bytes-a.bytes);
 sorted.forEach((n,i)=>{
  let x,y;
  if(mode==="grid"){const cols=Math.ceil(Math.sqrt(total)),rows=Math.ceil(total/cols);x=90+(i%cols)*(770/Math.max(1,cols-1));y=80+Math.floor(i/cols)*(510/Math.max(1,rows-1));}
  else if(mode==="star"){if(i===0){x=475;y=325}else{const a=2*Math.PI*(i-1)/Math.max(1,total-1)-Math.PI/2;x=475+300*Math.cos(a);y=325+270*Math.sin(a);}}
  else if(mode==="concentric"){const ring=Math.floor(Math.sqrt(i)),start=ring*ring,count=(ring+1)*(ring+1)-start,angle=2*Math.PI*(i-start)/count-Math.PI/2,radius=Math.min(275,ring*72);x=475+radius*Math.cos(angle);y=325+radius*Math.sin(angle);}
  else {const a=2*Math.PI*i/total-Math.PI/2;x=475+300*Math.cos(a);y=325+260*Math.sin(a);}
  positions.set(n.id,{x,y});
 });return positions;
}
function render(){if(!state)return;const q=el("search").value.trim().toLowerCase(),nodes=state.nodes,graph=el("graph");graph.replaceChildren();el("pairs").replaceChildren();if(!nodes.length)return;
const positions=arrange(nodes),metric=el("edgeMetric").value;
for(const e of state.edges){const a=positions.get(e.source),b=positions.get(e.target),match=!q||e.source.toLowerCase().includes(q)||e.target.toLowerCase().includes(q);const line=svg("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:edgeColor(e,metric),"stroke-opacity":match?0.62:0.06,"stroke-width":Math.max(1,Math.min(11,1+Math.log10(1+(metric==="packets"?e.packets:e.bytes))/1.3))},graph);line.addEventListener("click",()=>showEdge(e));const tr=document.createElement("tr");tr.style.opacity=match?1:.2;for(const val of [e.source+" ↔ "+e.target,e.bytes.toLocaleString(),String(e.streams)]){const td=document.createElement("td");td.textContent=val;tr.append(td)}tr.addEventListener("click",()=>showEdge(e));el("pairs").append(tr)}
for(const n of nodes){const p=positions.get(n.id),match=!q||n.id.toLowerCase().includes(q),color={internal:"#93d500",external:"#ff9b76",multicast:"#d6adfa",loopback:"#91baf0"}[n.role]||"#93acb9";svg("circle",{cx:p.x,cy:p.y,r:Math.max(5,Math.min(17,5+Math.log10(1+n.bytes))),fill:color,opacity:match?1:.18},graph);let t=svg("text",{x:p.x,y:p.y+(p.y>325?24:-18),"text-anchor":"middle",opacity:match?1:.25},graph);t.textContent=n.id}
el("status").textContent=state.shown_pairs+" top host pairs shown, "+nodes.length+" visible hosts. TCP traffic only."}
async function load(){const file=el("capture").value;if(!file)return;el("status").textContent="Loading traffic topology…";try{const resp=await fetch("/api/topology?file="+encodeURIComponent(file)+"&limit="+el("top").value);const d=await resp.json();if(resp.status===202){el("status").textContent="Building PCAP index; click Refresh to check again.";return}if(!resp.ok)throw Error(d.error||d.message||"HTTP "+resp.status);state=d;render()}catch(e){el("status").textContent="Topology unavailable: "+e.message}}
async function files(){try{const d=await(await fetch("/api/files")).json(),old=el("capture").value;el("capture").replaceChildren();for(const f of d.files){const o=document.createElement("option");o.value=f.name;o.textContent=f.name;el("capture").append(o)}if(d.files.some(f=>f.name===old))el("capture").value=old;await load()}catch(e){el("status").textContent=e.message}}
el("capture").addEventListener("change",load);el("top").addEventListener("change",load);el("search").addEventListener("input",render);el("layout").addEventListener("change",render);el("edgeMetric").addEventListener("change",render);el("reload").addEventListener("click",files);files();
</script></body></html>
