services:
  packettrain:
    build: .
    container_name: packettrain
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      PCAP_DIR: /pcaps
      MAX_PCAP_BYTES: 268435456
      MAX_PACKETS: 100000
      PACKETTRAIN_INDEX_DIR: /cache
    volumes:
      - ${PCAP_PATH:-./pcaps}:/pcaps:ro
      - packettrain-cache:/cache
    security_opt:
      - no-new-privileges:true

volumes:
  packettrain-cache:
